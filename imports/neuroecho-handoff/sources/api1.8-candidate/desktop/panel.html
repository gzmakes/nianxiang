<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回响 · 唤起条</title><link rel="stylesheet" href="panel.css"></head><body><main><header><span class="light" aria-hidden="true"></span><b>回响</b><span id="status" role="status">安静陪着</span><button id="close" aria-label="收起">×</button></header><section id="quick"><label for="draft">接着说，或者先记下一句</label><form id="draft-form"><input id="draft" maxlength="4000" placeholder="输入后带回对话，确认后再发送" autofocus><button type="submit">带入对话 ↗</button></form><nav><button data-open="chat">接着聊</button><button data-open="today">看今天</button><button data-open="new-memory">记一件事</button></nav></section><section id="tray" hidden><div class="card"><small>一件待确认的事</small><p id="one-thing">正在读取…</p><button id="see-task" data-open="tasks">现在看</button></div><button id="pause">本机系统通知暂停到明天 09:00</button><button id="resume" hidden>恢复本机系统通知</button><button data-open="settings">设置</button><p class="footnote">这里只控制本机系统通知。跨端关心边界请在对话中设置；不会代你批准或执行事项。</p></section></main><script src="panel.js"></script></body></html>
