<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>专注度接口调用示例</title><style>body{background:#101c2b;color:#dceafa;font:18px system-ui;max-width:800px;margin:60px auto;padding:20px}#content{background:#174c46;padding:45px;border-radius:20px}#status{color:#efc27d}a{color:#70d5d1}</style><h1>由专注度触发内容</h1><p>连续 2 秒 ≥60 时显示；低于45或信号无效时隐藏。只调用 HTTP/SSE，不直接占用串口。</p><p id="status">等待接口</p><article id="content" hidden><h2>已进入展示状态</h2><p>这里可以替换为图片、文字、视频，或 Windows 应用里的其他动作。</p></article><a href="/">返回波形页面</a><script>
let hold=null,show=false,last=0;const box=document.querySelector('#content'),status=document.querySelector('#status');
function unavailable(){hold=null;show=false;box.hidden=true;status.textContent='信号不可用，展示暂停'}
const events=new EventSource('/api/v1/events');events.addEventListener('metrics',e=>{last=performance.now();let s=JSON.parse(e.data),a=s.attention;if(!s.live||!a.valid||a.age_ms>2500){unavailable();return}status.textContent='专注度 '+a.value.toFixed(0);if(a.value>=60){hold=hold??performance.now();if(performance.now()-hold>=2000)show=true}else{hold=null;if(a.value<45)show=false}box.hidden=!show});events.onerror=unavailable;setInterval(()=>{if(performance.now()-last>1500)unavailable()},250);
</script></html>
